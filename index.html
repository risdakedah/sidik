<html lang="ms">
<head>

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://script.google.com https://script.googleusercontent.com;
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' https://i.ibb.co data:;
    connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net;
  ">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* ══════════════════════════════════════════════════════════
       100% VISUAL SAMA SEPERTI PORTAL KEDAH DI HATIKU
       Hanya kandungan teks & logik auth yang berbeza
    ══════════════════════════════════════════════════════════ */
    :root {
      --risda-green: #006837;
      --risda-gold:  #c6a355;
      --neon-green:  #00ff88;
      --dark-bg:     #0a0f0d;
    }

    body {
      background: radial-gradient(circle at center, #1a2a1f 0%, var(--dark-bg) 100%);
      font-family: 'Rajdhani', sans-serif;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .bg-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,255,136,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
    }

    /* ── Login Section ── */
    #login-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .login-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(198,163,85,0.3);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0,104,55,0.4);
      width: 100%;
      max-width: 450px;
    }

    /* Lockup penuh SiDiK — logo membawa nama dan tagline sendiri,
       jadi tiada teks berasingan di bawahnya. */
    .login-logo-bekas {
      position: relative;
      width: 300px;
      max-width: 100%;
      aspect-ratio: 6218 / 3169;
      margin: 0 auto 26px;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55));
    }
    .login-logo,
    .login-logo-kilat {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .login-logo { object-fit: contain; }

    /* Sapuan emas: bentuk logo dijadikan topeng, jadi cahaya
       mengikut lekuk huruf, menara dan padi — bukan kotak melintas. */
    .login-logo-kilat {
      -webkit-mask-image: url("sidik-logo.png");
              mask-image: url("sidik-logo.png");
      -webkit-mask-size: contain;      mask-size: contain;
      -webkit-mask-repeat: no-repeat;  mask-repeat: no-repeat;
      -webkit-mask-position: center;   mask-position: center;
      background-image: linear-gradient(105deg,
        rgba(255,255,255,0)   38%,
        rgba(255,246,214,0.7) 48%,
        rgba(255,255,255,0.92) 51%,
        rgba(255,246,214,0.7) 54%,
        rgba(255,255,255,0)   64%);
      background-size: 260% 100%;
      background-repeat: no-repeat;
      background-position: 210% 0;
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      animation: kilatSiDiK 6.5s cubic-bezier(0.4, 0, 0.5, 1) 1s infinite;
    }
    @keyframes kilatSiDiK {
      0%   { opacity: 0; background-position:  210% 0; }
      8%   { opacity: 1; }
      30%  { opacity: 1; background-position: -110% 0; }
      36%  { opacity: 0; background-position: -110% 0; }
      100% { opacity: 0; background-position: -110% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .login-logo-kilat { animation: none; opacity: 0; }
    }

    .login-card h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-green);
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 2px;
      line-height: 1.3;
      font-size: 1.8rem;
    }

    .login-card p {
      color: var(--risda-gold);
      font-size: 1.1rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .attempt-warning {
      font-size: 0.85rem;
      color: #ff9944;
      margin-bottom: 12px;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    .input-group-custom { margin-bottom: 20px; position: relative; }
    .input-group-custom i {
      position: absolute; left: 15px; top: 14px;
      color: var(--neon-green); z-index: 1;
    }
    .form-control-custom {
      width: 100%;
      padding: 12px 15px 12px 45px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      outline: none;
      transition: 0.3s;
      font-family: 'Rajdhani', sans-serif;
    }
    .form-control-custom:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px rgba(0,255,136,0.3);
    }
    .form-control-custom::placeholder { color: rgba(255,255,255,0.35); }

    .btn-login {
      background: linear-gradient(45deg, var(--risda-green), #009955);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Orbitron', sans-serif;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(0,255,136,0.4);
    }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Lockout overlay ── */
    .lockout-overlay {
      position: fixed; inset: 0;
      background: rgba(10,15,13,0.97);
      z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
    }
    .lockout-overlay h2 {
      font-family: 'Orbitron', sans-serif;
      color: #dc3545; font-size: 1.5rem; text-align: center;
    }
    .lockout-timer {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem; color: var(--risda-gold);
    }
    .lockout-overlay p { color: #aaa; max-width: 380px; text-align: center; line-height: 1.6; }

    /* ── Panel kejayaan ── */
    #panel-berjaya { display: none; }
    .ikon-berjaya {
      font-size: 3rem; color: var(--neon-green);
      margin-bottom: 16px;
      animation: nadi 1s ease-in-out infinite;
    }
    @keyframes nadi {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    footer {
      text-align: center; padding: 15px;
      background: rgba(0,0,0,0.6);
      color: #666; font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .login-card { padding: 35px 24px; }
      .login-card h2 { font-size: 1.4rem; }
      .login-logo-bekas { width: 232px; margin-bottom: 20px; }
    }
  </style>

<body>

<div class="bg-grid"></div>

<!-- ══════════════════════════════════════
     SEKSYEN LOG MASUK
══════════════════════════════════════ -->
<div id="login-section">
  <div class="login-card">

    <div class="login-logo-bekas">
      <img src="sidik-logo.png"
           alt="SiDiK — Sistem Data Induk Kedah"
           class="login-logo" draggable="false"
           width="800" height="408">
      <span class="login-logo-kilat" aria-hidden="true"></span>
    </div>

    <div class="attempt-warning" id="attemptWarning" aria-live="polite"></div>

    <!-- Panel borang -->
    <div id="panel-login">
      <form id="loginForm" autocomplete="off" novalidate>
        <div class="input-group-custom">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          <input type="email" id="emailInput" class="form-control-custom"
                 placeholder="Emel @risda.gov.my"
                 autocomplete="email" spellcheck="false"
                 maxlength="100" required
                 aria-label="Alamat emel RISDA">
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-shield-halved me-2" aria-hidden="true"></i>Akses SiDiK
        </button>
      </form>
    </div>

    <!-- Panel selepas berjaya -->
    <div id="panel-berjaya">
      <div class="ikon-berjaya"><i class="fas fa-circle-check"></i></div>
      <div style="font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--neon-green);letter-spacing:1.5px;margin-bottom:8px;">
        AKSES DISAHKAN
      </div>
      <div id="displayNama" style="color:var(--risda-gold);font-weight:700;font-size:1.05rem;margin-bottom:12px;"></div>
      <div style="color:#888;font-size:0.85rem;">
        <i class="fas fa-spinner fa-spin me-1"></i>Memuatkan SiDiK...
      </div>
      <div style="margin-top:14px;font-size:0.78rem;color:#666;line-height:1.6;">
        Tidak terbuka selepas beberapa saat?
        <a id="pautanSandaran" href="#" style="color:var(--risda-gold);text-decoration:underline;">Klik di sini</a><br>
        <span id="notaAkaun" style="color:#555;">Pilih akaun <b>@risda.gov.my</b> anda jika Google bertanya.</span>
      </div>
    </div>

  </div>
</div>

<footer>HAK CIPTA TERPELIHARA &copy; 2026 | INOVASI PENGURUSAN RISDA KEDAH</footer>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════════
// KONFIGURASI
// ══════════════════════════════════════════════════════════════════════
const CFG = Object.freeze({
  // URL generik — KHUSUS untuk panggilan JSONP pengesahan sahaja. JANGAN tukar
  // kepada bentuk /a/macros/: panggilan <script src> tidak boleh ikut redirect
  // pemilih akaun Google, ia akan gagal senyap.
  GAS_URL        : 'https://script.google.com/macros/s/AKfycbzHNXz-kDnSS0LHn9VQmOckeHfC58oXBomikv01zuTm0EgrB9ye0z82hxm7LNjR4CJVqw/exec',
  // URL domain-scoped — untuk redirect pengguna masuk ke SiDiK. Bentuk
  // /a/macros/risda.gov.my/ memaksa Google resolve guna akaun dalam domain
  // RISDA. Tanpa ini, Google guna akaun LALAI browser (authuser=0) — pengguna
  // yang akaun lalainya Gmail peribadi dapat "You need access" walaupun akaun
  // RISDA mereka sedang log masuk sebagai akaun kedua.
  GAS_URL_LANCAR : 'https://script.google.com/a/macros/risda.gov.my/s/AKfycbzHNXz-kDnSS0LHn9VQmOckeHfC58oXBomikv01zuTm0EgrB9ye0z82hxm7LNjR4CJVqw/exec',
  MAX_ATTEMPTS   : 5,
  LOCKOUT_MINUTES: 15,
  SESSION_MINUTES: 120,
  STORAGE_KEY    : 'sidik_sess_v2',
  LOCKOUT_KEY    : 'sidik_lock_v2',
  DOMAIN_SUFFIX  : '@risda.gov.my',
});

let attemptCount = 0;
let sessionTimer = null;
let sessionExpiry = null;

// ── Lockout ─────────────────────────────────────────────────────────
function bacaLockout() {
  try {
    const raw = sessionStorage.getItem(CFG.LOCKOUT_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() > obj.until) { sessionStorage.removeItem(CFG.LOCKOUT_KEY); return null; }
    return obj;
  } catch { return null; }
}

function tetapkanLockout() {
  const until = Date.now() + CFG.LOCKOUT_MINUTES * 60_000;
  sessionStorage.setItem(CFG.LOCKOUT_KEY, JSON.stringify({ until }));
  paparkanLockout(until);
}

function paparkanLockout(until) {
  document.getElementById('lockoutOverlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'lockout-overlay';
  overlay.id = 'lockoutOverlay';
  overlay.setAttribute('role', 'alert');
  overlay.innerHTML = `
    <i class="fas fa-shield-alt" style="font-size:4rem;color:#dc3545;"></i>
    <h2>🛑 AKSES DIKUNCI SEMENTARA</h2>
    <div class="lockout-timer" id="lockCountdown" aria-live="polite">--:--</div>
    <p>Terlalu banyak cubaan akses gagal. SiDiK dikunci buat sementara atas sebab keselamatan.</p>
    <p style="font-size:0.85rem;color:#666;">Hubungi pentadbir ICT jika memerlukan bantuan segera.</p>
  `;
  document.body.appendChild(overlay);
  kiraturunLockout(until, overlay);
}

function kiraturunLockout(until, overlay) {
  const tick = () => {
    const baki = Math.max(0, until - Date.now());
    const m = String(Math.floor(baki / 60_000)).padStart(2, '0');
    const s = String(Math.floor((baki % 60_000) / 1000)).padStart(2, '0');
    const el = document.getElementById('lockCountdown');
    if (el) el.textContent = `${m}:${s}`;
    if (baki <= 0) {
      overlay.remove();
      sessionStorage.removeItem(CFG.LOCKOUT_KEY);
      attemptCount = 0;
      kemaskinWarning();
    } else { setTimeout(tick, 1000); }
  };
  tick();
}

function kemaskinWarning() {
  const el = document.getElementById('attemptWarning');
  if (!el) return;
  const baki = CFG.MAX_ATTEMPTS - attemptCount;
  el.textContent = attemptCount > 0
    ? `⚠ ${baki} cubaan lagi sebelum SiDiK dikunci (${CFG.LOCKOUT_MINUTES} minit)`
    : '';
}

// ── Pengesahan emel ──────────────────────────────────────────────────
function sahkanFormatEmel(emel) {
  if (!emel || typeof emel !== 'string' || emel.length > 100) return false;
  return /^[a-z0-9][a-z0-9._-]{0,62}@risda\.gov\.my$/i.test(emel);
}

// ── SHA-256 Hash ─────────────────────────────────────────────────────
async function hashEmel(emel) {
  const encoded = new TextEncoder().encode(emel.toLowerCase().trim());
  const buf = await crypto.subtle.digest('SHA-256', encoded);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── JSONP ────────────────────────────────────────────────────────────
let kiraCallback = 0;

// urlAsas   — URL GAS yang hendak dipanggil (domain-scoped atau generik)
// timeoutMs — berapa lama tunggu sebelum mengalah
// emel      — jika diberi, disisip sebagai authuser supaya Google guna akaun
//             RISDA pengguna, bukan akaun lalai browser
function panggilGAS(token, urlAsas, timeoutMs, emel) {
  const asas  = urlAsas   || CFG.GAS_URL;
  const tempo = timeoutMs || 15000;
  return new Promise((resolve, reject) => {
    const cbName = 'gasCallback_' + Date.now() + '_' + (++kiraCallback);
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout — GAS tidak menjawab dalam ' + Math.round(tempo / 1000) + ' saat'));
    }, tempo);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) { cleanup(); resolve(data); };

    const url = asas
      + '?action=authenticate'
      + '&token=' + encodeURIComponent(token)
      + '&callback=' + cbName
      + '&ts=' + Date.now()
      + (emel ? '&authuser=' + encodeURIComponent(emel) : '');

    script.src = url;
    script.onerror = () => { cleanup(); reject(new Error('Skrip GAS gagal dimuatkan')); };
    document.head.appendChild(script);
  });
}

// Cuba pengesahan melalui URL domain-scoped dahulu (paling tinggi peluang
// berjaya bila pengguna ada beberapa akaun Google), kemudian URL generik
// sebagai sandaran. Jika kedua-duanya gagal, lontar ralat supaya pemanggil
// boleh hantar pengguna terus ke SiDiK — biar SiDiK sendiri yang tapis akses.
//
// semakanAkaunBerjaya = panggilan dengan authuser=<emel> berjaya, iaitu pelayar
// ini SUDAH log masuk Google sebagai emel yang ditaip. Jika gagal, redirect
// terus dengan authuser=<emel> berakhir di skrin buntu Google "Sorry, unable to
// open the file at present" — jadi hantar melalui pemilih akaun Google dahulu.
let semakanAkaunBerjaya = false;
async function panggilGASBerlapis(token, emel) {
  semakanAkaunBerjaya = false;
  try {
    const data = await panggilGAS(token, CFG.GAS_URL_LANCAR, 12000, emel);
    semakanAkaunBerjaya = true;
    return data;
  } catch (e1) {
    return await panggilGAS(token, CFG.GAS_URL, 8000);
  }
}

// ── Log Masuk ────────────────────────────────────────────────────────
async function prosesLogin(e) {
  e.preventDefault();

  const kunci = bacaLockout();
  if (kunci) { paparkanLockout(kunci.until); return; }

  const loginBtn = document.getElementById('loginBtn');
  const emel = document.getElementById('emailInput').value.toLowerCase().trim();

  if (!sahkanFormatEmel(emel)) {
    Swal.fire({ icon:'warning', title:'Format Emel Tidak Sah', text:'Sila masukkan emel rasmi anda.', background:'#0a0f0d', color:'#fff' });
    return;
  }

  sediakanBunyi();
  attemptCount++;
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Mengesahkan...';

  Swal.fire({ title:'MENGESAHKAN IDENTITI...', html:'Sistem sedang menyemak kelayakan akses anda.', background:'#0a0f0d', color:'#fff', allowOutsideClick:false, showConfirmButton:false, didOpen:() => Swal.showLoading() });

  try {
    const token = await hashEmel(emel);
    const data  = await panggilGASBerlapis(token, emel);

    if (data && data.status === 'OK' && data.authorised === true) {
      attemptCount = 0;
      
      // ✅ PERUBAHAN DI SINI: Tambah 'data.akses'
      simpanSesi(emel, data.nama || emel.split('@')[0], data.peranan, data.ptj, data.akses); 
      
      Swal.close();
      mainkanBunyi();
      tunjukKejayaan(emel, data.nama, !semakanAkaunBerjaya);
    } else {
      Swal.close();
      tanganiGagal(data && data.akaunBerbeza === true);
    }
  } catch (err) {
    // Semakan awal tidak dapat dijalankan (biasanya kerana Google menyekat
    // panggilan itu bila akaun lalai browser bukan akaun risda.gov.my).
    //
    // JANGAN halang pengguna di sini — dulu gerbang papar "Ralat Sambungan"
    // dan pengguna terkandas walaupun mereka sebenarnya berhak masuk.
    // Hantar mereka terus ke SiDiK; SiDiK sendiri yang tapis akses melalui
    // Session.getActiveUser() + matriks Akses_Peranan. Tiada risiko keselamatan
    // kerana gerbang ini hanya lapisan paparan, bukan pengawal sebenar.
    attemptCount = Math.max(0, attemptCount - 1);
    kemaskinWarning();

    Swal.close();
    const url = urlLancarSiDiK(emel, true);
    Swal.fire({
      icon: 'info',
      title: 'Menghantar Anda Ke SiDiK',
      html: 'Semakan awal tidak dapat dilakukan buat sementara waktu.<br>'
          + 'Anda akan dihantar terus ke SiDiK — kebenaran akses anda tetap disemak di sana.'
          + '<br><br><span style="font-size:0.85rem;color:#888;">Jika Google bertanya akaun mana, sila pilih akaun <b>@risda.gov.my</b> anda.</span>',
      background: '#0a0f0d', color: '#fff',
      timer: 4000,
      timerProgressBar: true,
      allowOutsideClick: false,
      confirmButtonText: '<i class="fas fa-arrow-right me-1"></i> Teruskan Sekarang',
      confirmButtonColor: '#009955'
    }).then(() => {
      resetBtn();
      window.location.href = url;
    });
  }
}

// akaunBerbeza = pelayan dapati emel yang ditaip BUKAN akaun Google yang sedang
// log masuk dalam pelayar ini (rujuk prosesAuthSiDiK dalam Code.js SiDiK).
function tanganiGagal(akaunBerbeza) {
  mainkanBunyi('ditolak');
  if (attemptCount >= CFG.MAX_ATTEMPTS) { Swal.close(); tetapkanLockout(); return; }
  kemaskinWarning();
  resetBtn();
  if (akaunBerbeza) {
    Swal.fire({ icon:'error', title:'🛑 EMEL TIDAK SEPADAN',
      html:'Emel ini bukan akaun Google yang sedang log masuk dalam pelayar ini.<br><br>'
         + '<span style="font-size:0.9rem;color:#aaa;">Taip emel akaun anda sendiri, atau log masuk Google sebagai emel tersebut dahulu.</span>',
      background:'#0a0f0d', color:'#fff', confirmButtonColor:'#dc3545' });
    return;
  }
  Swal.fire({ icon:'error', title:'🛑 AKSES DISEKAT',
    text:'Emel anda tidak mempunyai kebenaran akses SiDiK.',
    background:'#0a0f0d', color:'#fff', confirmButtonColor:'#dc3545' });
}

function resetBtn() {
  const btn = document.getElementById('loginBtn');
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-shield-halved me-2"></i>Masuk SiDiK';
  }
}

// ── Paparan kejayaan & redirect ──────────────────────────────────────
// Bina URL lancar: domain-scoped + authuser=<emel>. Parameter authuser
// memberitahu Google akaun MANA satu hendak digunakan antara berbilang akaun
// yang sedang log masuk; ia dimakan oleh Google dan tidak sampai ke doGet().
//
// melaluiPilihAkaun = true: lalu dahulu halaman log masuk Google dengan emel
// sudah terisi. Jika pelayar belum log masuk sebagai emel itu, Google minta
// kata laluannya, kemudian terus membuka SiDiK (parameter continue).
function urlLancarSiDiK(emel, melaluiPilihAkaun) {
  const base = CFG.GAS_URL_LANCAR;
  const url  = emel ? base + '?authuser=' + encodeURIComponent(emel) : base;
  if (!emel || !melaluiPilihAkaun) return url;
  return 'https://accounts.google.com/AccountChooser'
    + '?Email=' + encodeURIComponent(emel)
    + '&continue=' + encodeURIComponent(url);
}

function tunjukKejayaan(emel, nama, melaluiPilihAkaun) {
  const papar = nama || emel.split('@')[0];
  const url   = urlLancarSiDiK(emel, melaluiPilihAkaun);
  document.getElementById('panel-login').style.display  = 'none';
  document.getElementById('panel-berjaya').style.display = 'block';
  document.getElementById('displayNama').textContent     = papar;

  // Pautan sandaran — jika redirect tersangkut di skrin akaun Google,
  // pengguna masih ada jalan masuk tanpa perlu tukar browser/incognito.
  const sandaran = document.getElementById('pautanSandaran');
  if (sandaran) sandaran.href = url;
  const nota = document.getElementById('notaAkaun');
  if (nota && melaluiPilihAkaun) {
    nota.textContent = 'Google akan meminta anda log masuk sebagai ' + emel + ' sebelum SiDiK dibuka.';
  }

  // Redirect ke SiDiK GAS selepas 2 saat
  setTimeout(() => { window.location.href = url; }, 2000);
}

// ── Sesi ─────────────────────────────────────────────────────────────
function simpanSesi(emel, nama, peranan, ptj, akses) {
  const expiry = Date.now() + CFG.SESSION_MINUTES * 60_000;
  // ✅ PERUBAHAN DI SINI: Masukkan 'akses' ke dalam JSON
  sessionStorage.setItem(CFG.STORAGE_KEY, btoa(JSON.stringify({ emel, nama, peranan, ptj, akses, expiry })));
  sessionExpiry = expiry;
}

function bacaSesi() {
  try {
    const raw = sessionStorage.getItem(CFG.STORAGE_KEY);
    if (!raw) return null;
    const sesi = JSON.parse(atob(raw));
    if (!sesi?.expiry || !sesi.emel || Date.now() > sesi.expiry) {
      sessionStorage.removeItem(CFG.STORAGE_KEY); return null;
    }
    return sesi;
  } catch { return null; }
}

function perbaharuiSesi() {
  const sesi = bacaSesi();
  if (!sesi) return;
  sesi.expiry = Date.now() + CFG.SESSION_MINUTES * 60_000;
  sessionStorage.setItem(CFG.STORAGE_KEY, btoa(JSON.stringify(sesi)));
  sessionExpiry = sesi.expiry;
}

// ── Bunyi log masuk ──────────────────────────────────────────────────
// 'berjaya' = Pintu Bilik Kebal (desis hidraulik + dentang logam + nada naik)
// 'ditolak' = Pintu Terkunci (desis terhenti + klunk berat + nada menurun)
// Dijana terus dengan Web Audio — tiada fail audio untuk dimuat turun.
let _audioCtx = null;

// Panggil SEGERA dalam pengendali klik, sebelum sebarang await. Pelayar
// (terutama Safari iPhone) menyekat AudioContext yang dicipta/disambung
// beberapa saat selepas klik — semakan GAS boleh mengambil masa itu.
function sediakanBunyi() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
  } catch { _audioCtx = null; }
}

function mainkanBunyi(jenis = 'berjaya') {
  try {
    sediakanBunyi();
    const c = _audioCtx;
    if (!c) return;
    const t0 = c.currentTime;

    const keluar = c.createGain(), komp = c.createDynamicsCompressor();
    keluar.gain.value = 0.9;
    keluar.connect(komp); komp.connect(c.destination);

    // Gema ringkas — impuls hingar yang mereput
    const gema = (saat, reput, basah) => {
      const len = Math.floor(c.sampleRate * saat), buf = c.createBuffer(2, len, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, reput);
      }
      const cv = c.createConvolver(), w = c.createGain();
      cv.buffer = buf; w.gain.value = basah;
      cv.connect(w); w.connect(keluar);
      return cv;
    };
    const nada = (dest, { jenis = 'sine', f0, f1, mula = 0, dur = 0.3, vol = 0.3, serang = 0.01 }) => {
      const t = t0 + mula, o = c.createOscillator(), g = c.createGain();
      o.type = jenis;
      o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + serang);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); dest.forEach(x => g.connect(x));
      o.start(t); o.stop(t + dur + 0.05);
    };
    const desis = (dur, frekPotong, vol) => {
      const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const s = c.createBufferSource(), hp = c.createBiquadFilter(), g = c.createGain();
      s.buffer = buf; hp.type = 'highpass'; hp.frequency.value = frekPotong;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(hp); hp.connect(g); g.connect(keluar); s.start(t0);
    };

    if (jenis === 'ditolak') {
      const r = gema(2.2, 2.4, 0.45);
      desis(0.25, 2500, 0.3);
      nada([keluar], { f0: 80, f1: 35, mula: 0.22, dur: 0.45, vol: 0.9, serang: 0.003 });
      [1, 2.4, 4.1].forEach((k, i) => nada([keluar, r], { f0: 140 * k, mula: 0.22, dur: 0.5 - i * 0.1, vol: 0.2 / (i + 1), serang: 0.002 }));
      nada([keluar, r], { jenis: 'triangle', f0: 330, f1: 165,   mula: 0.55, dur: 0.9, vol: 0.18, serang: 0.05 });
      nada([keluar, r], { jenis: 'triangle', f0: 311, f1: 155.5, mula: 0.55, dur: 0.9, vol: 0.1,  serang: 0.05 });
    } else {
      const r = gema(2.5, 2.2, 0.5);
      desis(0.55, 3000, 0.35);
      nada([keluar], { f0: 110, f1: 45, mula: 0.35, dur: 0.4, vol: 0.8, serang: 0.004 });
      [1, 2.76, 5.4, 8.93].forEach((k, i) => nada([keluar, r], { f0: 220 * k, mula: 0.35, dur: 1.3 - i * 0.2, vol: 0.18 / (i + 1), serang: 0.002 }));
      nada([keluar, r], { f0: 659.3, f1: 880, mula: 0.75, dur: 1.0, vol: 0.12, serang: 0.2 });
    }
  } catch { /* AudioContext tidak tersedia — log masuk diteruskan tanpa bunyi */ }
}
